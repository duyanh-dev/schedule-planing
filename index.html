<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Itinerary Planner Pro</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <!-- Leaflet CSS for Map -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    
    <link rel="stylesheet" href="./style.css">
</head>

<body class="text-slate-800 h-[100dvh] overflow-hidden flex bg-slate-50">

    <!-- Mobile Header -->
    <header class="md:hidden fixed top-0 left-0 right-0 h-16 bg-white/90 backdrop-blur-md border-b border-slate-200 z-40 flex items-center justify-between px-4 shadow-sm">
        <h1 class="text-xl font-black text-slate-900 flex items-center gap-2 tracking-tight">
            <i class="fa-solid fa-plane-departure text-blue-600"></i> Wanderlog
        </h1>
        <button onclick="toggleSidebar()" class="w-10 h-10 flex items-center justify-center rounded-full bg-slate-100 text-slate-600 active:bg-slate-200 transition-colors">
            <i class="fa-solid fa-bars text-lg"></i>
        </button>
    </header>

    <!-- Sidebar Overlay -->
    <div id="sidebar-overlay" onclick="toggleSidebar()" class="fixed inset-0 bg-slate-900/50 z-40 hidden md:hidden transition-opacity opacity-0"></div>

    <!-- Sidebar -->
    <aside id="sidebar" class="fixed md:static inset-y-0 left-0 w-72 md:w-80 bg-white border-r border-slate-200 flex flex-col flex-shrink-0 z-50 transform -translate-x-full md:translate-x-0 transition-transform duration-300 ease-in-out h-[100dvh] shadow-2xl md:shadow-none">
        <div class="p-6 border-b border-slate-100 hidden md:flex items-center justify-between">
            <h1 class="text-2xl font-black text-slate-900 flex items-center gap-3 tracking-tight">
                <i class="fa-solid fa-plane-departure text-blue-600 bg-blue-50 p-2 rounded-xl"></i> Planner
            </h1>
        </div>
        
        <div class="h-16 px-4 border-b border-slate-100 flex items-center justify-between md:hidden bg-slate-50">
            <span class="font-bold text-slate-700 text-lg">Danh sách chuyến đi</span>
            <button onclick="toggleSidebar()" class="w-10 h-10 flex items-center justify-center rounded-full bg-slate-200 text-slate-600">
                <i class="fa-solid fa-xmark text-xl"></i>
            </button>
        </div>
        
        <div class="p-4 flex-1 overflow-y-auto hide-scrollbar">
            <div class="flex items-center justify-between mb-4">
                <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider">Chuyến đi của bạn</h2>
                <button onclick="openTripModal()" class="text-blue-600 bg-blue-50 hover:bg-blue-100 w-8 h-8 rounded-lg transition-colors flex items-center justify-center shadow-sm" title="Thêm chuyến đi">
                    <i class="fa-solid fa-plus"></i>
                </button>
            </div>
            <div id="trips-list" class="space-y-3">
                <!-- Trips rendered via JS -->
            </div>
        </div>
    </aside>

    <!-- Main Content -->
    <!-- Added pt-16 to prevent header overlapping on mobile -->
    <main class="flex-1 flex flex-col h-[100dvh] overflow-hidden relative pt-16 md:pt-0 w-full bg-slate-50">
        
        <!-- Sticky Up Next Banner -->
        <div id="next-activity-banner" class="absolute top-20 md:top-6 left-1/2 -translate-x-1/2 z-30 bg-slate-900/95 backdrop-blur-md text-white px-5 py-3 rounded-full shadow-xl shadow-slate-900/20 flex items-center gap-3 text-sm font-semibold transition-all duration-500 transform -translate-y-[150%] opacity-0 pointer-events-none w-[90%] md:w-auto max-w-md border border-slate-700">
            <div class="w-3 h-3 rounded-full bg-emerald-400 animate-pulse flex-shrink-0 shadow-[0_0_8px_rgba(52,211,153,0.8)]"></div>
            <span id="next-activity-text" class="truncate">Tiếp theo: ...</span>
        </div>

        <div class="flex-1 overflow-y-auto hide-scrollbar scroll-smooth relative" id="main-scroll">
            
            <!-- Trip Header (Cover Image with Upload Feature) -->
            <div id="trip-header-container" class="relative h-64 md:h-80 w-full bg-slate-300 flex-shrink-0 overflow-hidden group">
                <img id="trip-cover-img" src="" class="absolute inset-0 w-full h-full object-cover transition-transform duration-700 group-hover:scale-105" alt="Cover">
                <div class="absolute inset-0 cover-gradient"></div>
                
                <!-- Upload input overlapping cover -->
                <input type="file" id="cover-upload" accept="image/*" capture="environment" onchange="handleImageUpload(event)" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-20" title="Đổi ảnh bìa">
                
                <div class="absolute bottom-6 left-4 md:bottom-10 md:left-8 z-10 max-w-3xl pr-4 pointer-events-none">
                    <span class="px-3 py-1.5 bg-blue-600/90 backdrop-blur-sm rounded-lg text-white text-[10px] font-black uppercase tracking-wider mb-3 inline-block shadow-sm">
                        <i class="fa-solid fa-camera mr-1"></i> Chạm để đổi ảnh
                    </span>
                    <h2 id="trip-title-display" class="text-3xl md:text-5xl font-black text-white drop-shadow-md tracking-tight leading-tight">...</h2>
                </div>
            </div>

            <!-- Controls & Timeline Container -->
            <div class="max-w-4xl mx-auto px-3 md:px-8 pb-20 -mt-10 relative z-20">
                
                <!-- Info Card (Tabs, Clock, Simulator) -->
                <div class="bg-white rounded-3xl shadow-xl shadow-slate-200/40 border border-slate-100 p-4 md:p-6 mb-6 flex flex-col gap-5">
                    
                    <!-- Days Tabs -->
                    <div class="flex items-center gap-2">
                        <div id="days-tabs" class="flex overflow-x-auto hide-scrollbar gap-3 pb-2 flex-1 scroll-smooth">
                            <!-- Tabs injected via JS -->
                        </div>
                        <button onclick="addNewDay()" class="flex-shrink-0 h-16 px-4 md:px-6 rounded-2xl border-2 border-dashed border-slate-200 hover:border-blue-400 hover:bg-blue-50 text-slate-400 hover:text-blue-500 transition-colors flex flex-col items-center justify-center font-bold text-xs gap-1 group">
                            <i class="fa-solid fa-plus text-base group-hover:scale-110 transition-transform"></i>
                        </button>
                    </div>

                    <!-- Simulator & Actions -->
                    <div class="flex flex-col md:flex-row items-center justify-between gap-4 border-t border-slate-100 pt-4">
                        
                        <!-- Time Simulator -->
                        <div class="flex-1 w-full bg-slate-50 p-4 rounded-2xl border border-slate-100 flex flex-col justify-center">
                            <div class="flex justify-between items-center mb-2">
                                <label class="text-xs font-bold text-slate-500 flex items-center gap-2 cursor-pointer">
                                    <input type="checkbox" id="sim-toggle" onchange="toggleSimulator()" class="w-4 h-4 rounded text-blue-600 focus:ring-blue-500">
                                    Mô phỏng thời gian (Test)
                                </label>
                                <span id="clock-display" class="font-black text-xl text-blue-600 flex items-center gap-1.5">
                                    <i class="fa-solid fa-clock"></i> <span>00:00</span>
                                </span>
                            </div>
                            <input type="range" id="sim-slider" min="0" max="1439" value="480" disabled oninput="updateSimulatedTime()" class="w-full h-2 bg-slate-200 rounded-lg appearance-none disabled:opacity-50 transition-opacity">
                        </div>

                        <!-- Action Buttons -->
                        <div class="flex items-center gap-3 w-full md:w-auto">
                            <button onclick="openGlobalTimeline()" class="flex-1 md:flex-none px-5 py-4 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-2xl font-bold text-sm transition-colors flex justify-center items-center gap-2 shadow-sm">
                                <i class="fa-solid fa-calendar-days text-slate-400"></i> Toàn cảnh
                            </button>
                            <button onclick="openActivityModal()" class="flex-1 md:flex-none px-6 py-4 bg-blue-600 hover:bg-blue-700 text-white rounded-2xl font-bold text-sm shadow-lg shadow-blue-200 transition-transform active:scale-95 flex justify-center items-center gap-2">
                                <i class="fa-solid fa-plus"></i> Thêm HĐ
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Timeline -->
                <div id="timeline-container" class="relative timeline-line mt-4 pl-3 md:pl-0">
                    <!-- Activities injected here via JS -->
                </div>
            </div>
        </div>
    </main>

    <!-- Activity Modal -->
    <div id="activity-modal" class="modal-overlay fixed inset-0 bg-slate-900/60 backdrop-blur-sm p-3 md:p-4 flex flex-col justify-end md:justify-center">
        <div class="modal-content bg-white rounded-3xl w-full max-w-2xl h-[90vh] md:max-h-[85vh] flex flex-col shadow-2xl relative overflow-hidden">
            
            <div class="p-5 border-b border-slate-100 flex justify-between items-center bg-white z-10 shadow-sm">
                <h2 id="act-modal-title" class="text-xl font-black text-slate-900 flex items-center gap-2">
                    <i class="fa-solid fa-pen text-blue-500 bg-blue-50 p-2 rounded-lg"></i> Hoạt động
                </h2>
                <button onclick="closeActivityModal()" class="w-9 h-9 flex items-center justify-center bg-slate-100 hover:bg-slate-200 rounded-full text-slate-600 transition-colors">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            
            <form id="activity-form" class="p-5 overflow-y-auto hide-scrollbar space-y-6 flex-1 bg-slate-50/50" onsubmit="submitActivityForm(event)">
                <input type="hidden" id="act-id">
                
                <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 space-y-4">
                    <div class="space-y-1.5">
                        <label class="text-sm font-bold text-slate-700">Tên hoạt động <span class="text-red-500">*</span></label>
                        <input type="text" id="act-details" required placeholder="VD: Khám phá chợ đêm, Ăn hải sản..." class="w-full p-3.5 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-blue-500 outline-none font-semibold text-slate-800 transition-all text-base">
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div class="space-y-1.5">
                            <label class="text-sm font-bold text-slate-700">Từ giờ <span class="text-red-500">*</span></label>
                            <input type="time" id="act-start" required class="w-full p-3.5 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-blue-500 outline-none font-bold text-slate-800">
                        </div>
                        <div class="space-y-1.5">
                            <label class="text-sm font-bold text-slate-700">Đến giờ <span class="text-red-500">*</span></label>
                            <input type="time" id="act-end" required class="w-full p-3.5 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-blue-500 outline-none font-bold text-slate-800">
                        </div>
                    </div>
                </div>

                <!-- Từ -> Đến UI with visual arrow -->
                <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 space-y-3">
                    <label class="text-sm font-bold text-slate-700 block">Lịch trình di chuyển (Từ <i class="fa-solid fa-arrow-right text-slate-400 mx-1"></i> Đến)</label>
                    
                    <div class="flex flex-col md:flex-row gap-3 items-center w-full">
                        <!-- Origin -->
                        <div class="flex-1 w-full relative">
                            <input type="text" id="act-from" placeholder="Điểm xuất phát..." class="w-full p-3.5 pr-12 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-blue-500 outline-none font-medium text-sm">
                            <button type="button" onclick="openMapPicker('act-from')" class="absolute right-2 top-1/2 -translate-y-1/2 w-9 h-9 flex items-center justify-center bg-blue-100 text-blue-600 rounded-lg hover:bg-blue-200 transition-colors shadow-sm" title="Chọn trên bản đồ">
                                <i class="fa-solid fa-map-location-dot"></i>
                            </button>
                        </div>
                        
                        <!-- Visual Arrow -->
                        <div class="flex-shrink-0 text-slate-300 md:rotate-0 rotate-90 my-1 md:my-0">
                            <i class="fa-solid fa-arrow-right text-xl"></i>
                        </div>

                        <!-- Destination -->
                        <div class="flex-1 w-full relative">
                            <input type="text" id="act-to" placeholder="Điểm đến..." class="w-full p-3.5 pr-12 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-blue-500 outline-none font-medium text-sm">
                            <button type="button" onclick="openMapPicker('act-to')" class="absolute right-2 top-1/2 -translate-y-1/2 w-9 h-9 flex items-center justify-center bg-blue-100 text-blue-600 rounded-lg hover:bg-blue-200 transition-colors shadow-sm" title="Chọn trên bản đồ">
                                <i class="fa-solid fa-map-location-dot"></i>
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Phân loại & Phương tiện -->
                <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 grid grid-cols-1 md:grid-cols-2 gap-5">
                    <div class="space-y-2">
                        <label class="text-sm font-bold text-slate-700">Phân loại</label>
                        <div class="flex gap-2">
                            <select id="act-icon" class="w-16 p-3.5 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none text-center text-xl">
                                <option value="fa-location-dot">📍</option>
                                <option value="fa-plane">✈️</option>
                                <option value="fa-car">🚗</option>
                                <option value="fa-train">🚆</option>
                                <option value="fa-utensils">🍽️</option>
                                <option value="fa-camera">📸</option>
                                <option value="fa-bag-shopping">🛍️</option>
                                <option value="fa-bed">🛏️</option>
                            </select>
                            <select id="act-type" class="flex-1 p-3.5 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none font-bold text-slate-700 text-sm">
                                <option value="Tham quan">Tham quan</option><option value="Di chuyển">Di chuyển</option>
                                <option value="Ăn uống">Ăn uống</option><option value="Mua sắm">Mua sắm</option>
                                <option value="Khách sạn">Khách sạn</option><option value="Khác">Khác</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="space-y-2">
                        <label class="text-sm font-bold text-slate-700">Phương tiện</label>
                        <select id="act-transport-select" onchange="handleTransportChange()" class="w-full p-3.5 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none font-semibold text-slate-700 text-sm">
                            <option value="">Không có</option>
                            <option value="Đi bộ">🚶 Đi bộ</option>
                            <option value="Taxi / Grab">🚗 Taxi / Grab</option>
                            <option value="Tàu hỏa / MRT">🚆 Tàu hỏa / MRT</option>
                            <option value="Máy bay">✈️ Máy bay</option>
                            <option value="other">✏️ Khác (Nhập tay)...</option>
                        </select>
                        <!-- Hidden input for custom transport -->
                        <input type="text" id="act-transport-input" placeholder="Nhập tên phương tiện..." class="hidden w-full mt-2 p-3.5 bg-white border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none font-medium text-sm transition-all">
                    </div>
                </div>
            </form>
            
            <div class="p-4 md:p-5 flex justify-end gap-3 border-t border-slate-100 bg-white z-10">
                <button type="button" onclick="closeActivityModal()" class="px-6 py-3 font-bold text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-xl transition-colors">Hủy</button>
                <button type="button" onclick="document.getElementById('activity-form').requestSubmit()" class="px-8 py-3 font-bold text-white bg-blue-600 hover:bg-blue-700 rounded-xl shadow-lg shadow-blue-200/50 transition-transform active:scale-95 flex items-center gap-2">
                    <i class="fa-solid fa-check"></i> Lưu lại
                </button>
            </div>
        </div>
    </div>

    <!-- Map Picker Modal (Leaflet) -->
    <div id="map-picker-modal" class="modal-overlay fixed inset-0 bg-slate-900/95 backdrop-blur-sm p-0 md:p-6 flex-col z-[10000]">
        <div class="modal-content bg-white w-full h-full md:h-[85vh] md:max-w-4xl md:rounded-3xl flex flex-col overflow-hidden shadow-2xl relative">
            
            <div class="p-4 border-b border-slate-100 flex justify-between items-center bg-white z-20 shadow-sm">
                <h3 class="font-black text-slate-900 text-lg flex items-center gap-2">
                    <i class="fa-solid fa-map-location-dot text-blue-500"></i> Chọn vị trí trên bản đồ
                </h3>
                <button onclick="closeMapPicker()" class="w-8 h-8 bg-slate-100 rounded-full flex items-center justify-center text-slate-600 hover:bg-slate-200"><i class="fa-solid fa-xmark"></i></button>
            </div>
            
            <!-- Map Container -->
            <div class="flex-1 relative bg-slate-200 w-full min-h-[400px]" id="picker-map-container">
                <div id="picker-map" class="absolute inset-0 w-full h-full z-10"></div>
                
                <!-- Thanh tìm kiếm & Gợi ý (Nổi trên bản đồ) -->
                <div class="absolute top-2 left-2 right-2 md:top-4 md:left-4 md:right-4 z-[1000] space-y-2 pointer-events-none">
                    
                    <!-- Ô nhập liệu -->
                    <div class="flex gap-2 pointer-events-auto shadow-xl rounded-xl">
                        <div class="relative flex-1 bg-white/95 backdrop-blur rounded-xl border border-slate-100 flex items-center px-3">
                            <i class="fa-solid fa-magnifying-glass text-slate-400"></i>
                            <input type="text" id="map-search-input" placeholder="Tìm kiếm địa điểm..." class="w-full py-3 px-3 outline-none text-sm font-semibold bg-transparent text-slate-800" onkeydown="if(event.key==='Enter') searchMapLocation()">
                            <button onclick="document.getElementById('map-search-input').value = ''; document.getElementById('search-results').classList.add('hidden')" class="text-slate-300 hover:text-red-500 px-2 transition-colors"><i class="fa-solid fa-xmark"></i></button>
                        </div>
                        <button onclick="searchMapLocation()" class="bg-blue-600 text-white px-4 rounded-xl shadow-lg hover:bg-blue-700 font-bold text-sm pointer-events-auto transition-colors"><i class="fa-solid fa-arrow-right"></i></button>
                    </div>
                    
                    <!-- Dropdown Kết quả tìm kiếm -->
                    <div id="search-results" class="bg-white/95 backdrop-blur rounded-xl shadow-xl border border-slate-100 max-h-48 overflow-y-auto hidden pointer-events-auto">
                        <!-- Kết quả JS đổ vào đây -->
                    </div>

                    <!-- Các nút gợi ý nhanh -->
                    <div class="flex gap-2 overflow-x-auto hide-scrollbar pointer-events-auto pb-1">
                        <button onclick="getUserLocation()" class="flex-shrink-0 px-3 py-2 bg-slate-900 text-white text-xs font-bold rounded-lg shadow-md whitespace-nowrap hover:bg-slate-800 transition-colors"><i class="fa-solid fa-location-crosshairs mr-1 text-blue-400"></i> Vị trí của tôi</button>
                        <button onclick="quickSearch('Nhà hàng')" class="flex-shrink-0 px-3 py-2 bg-white text-slate-700 text-xs font-bold rounded-lg shadow-md whitespace-nowrap hover:bg-blue-50 border border-slate-100 transition-colors"><i class="fa-solid fa-utensils text-orange-500 mr-1"></i> Nhà hàng</button>
                        <button onclick="quickSearch('Khách sạn')" class="flex-shrink-0 px-3 py-2 bg-white text-slate-700 text-xs font-bold rounded-lg shadow-md whitespace-nowrap hover:bg-blue-50 border border-slate-100 transition-colors"><i class="fa-solid fa-bed text-blue-500 mr-1"></i> Khách sạn</button>
                        <button onclick="quickSearch('Quán cà phê')" class="flex-shrink-0 px-3 py-2 bg-white text-slate-700 text-xs font-bold rounded-lg shadow-md whitespace-nowrap hover:bg-blue-50 border border-slate-100 transition-colors"><i class="fa-solid fa-mug-hot text-amber-700 mr-1"></i> Cafe</button>
                    </div>
                </div>

                <!-- Loading indicator -->
                <div id="map-loading" class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 bg-white/95 backdrop-blur px-5 py-3 rounded-full shadow-2xl font-bold text-sm text-slate-700 items-center gap-2 hidden z-[1000] border border-slate-100">
                    <i class="fa-solid fa-spinner fa-spin text-blue-600"></i> Đang tải...
                </div>
            </div>

            <div class="p-5 bg-white border-t border-slate-100 z-20 flex flex-col sm:flex-row gap-4 items-center justify-between shadow-[0_-10px_20px_rgba(0,0,0,0.05)] pb-8 md:pb-5">
                <div class="flex-1 w-full min-w-0 bg-slate-50 p-3 rounded-xl border border-slate-100">
                    <p class="text-[10px] font-black text-slate-400 uppercase tracking-wider mb-1">Địa chỉ đã chọn:</p>
                    <p id="map-selected-address" class="text-sm font-bold text-slate-800 truncate">Chạm vào bản đồ để chọn vị trí</p>
                </div>
                <button onclick="confirmMapSelection()" id="btn-confirm-map" disabled class="w-full sm:w-auto px-8 py-3.5 font-bold text-white bg-slate-900 rounded-xl transition-all disabled:opacity-50 disabled:cursor-not-allowed shadow-md">
                    Xác nhận chọn
                </button>
            </div>
        </div>
    </div>

    <!-- Global Timeline Modal -->
    <div id="global-timeline-modal" class="modal-overlay fixed inset-0 bg-slate-900/80 backdrop-blur-sm p-4 items-center justify-center z-[9000]">
        <div class="modal-content bg-white rounded-3xl w-full max-w-2xl h-[85vh] flex flex-col shadow-2xl">
            <div class="p-6 border-b border-slate-100 flex justify-between items-center bg-slate-50 rounded-t-3xl shadow-sm z-10">
                <h2 class="text-xl font-black text-slate-900"><i class="fa-solid fa-list-check text-blue-500 mr-2"></i> Lịch trình toàn cảnh</h2>
                <button onclick="closeGlobalTimeline()" class="w-9 h-9 rounded-full bg-white border border-slate-200 hover:bg-slate-100 flex items-center justify-center text-slate-600 transition"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="p-4 md:p-6 overflow-y-auto hide-scrollbar flex-1 bg-slate-50" id="global-timeline-content">
                <!-- Injected via JS -->
            </div>
        </div>
    </div>

    <!-- New Trip Modal -->
    <div id="trip-modal" class="modal-overlay fixed inset-0 bg-slate-900/80 backdrop-blur-sm p-4 items-center justify-center z-[9000]">
        <div class="modal-content bg-white rounded-3xl w-full max-w-md shadow-2xl">
            <div class="p-5 border-b border-slate-100 flex justify-between items-center bg-slate-50 rounded-t-3xl">
                <h2 class="text-lg font-black text-slate-900"><i class="fa-solid fa-plane text-blue-500 mr-2"></i> Chuyến đi mới</h2>
                <button onclick="closeTripModal()" class="w-8 h-8 rounded-full bg-white border border-slate-200 flex items-center justify-center text-slate-600"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="p-6 space-y-5">
                <div class="space-y-1.5">
                    <label class="text-sm font-bold text-slate-700">Tên chuyến đi</label>
                    <input type="text" id="trip-title" required placeholder="VD: Khám phá Vũng Tàu..." class="w-full p-3.5 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-blue-500 outline-none font-semibold text-sm">
                </div>
                <div class="space-y-1.5">
                    <label class="text-sm font-bold text-slate-700">Ngày bắt đầu</label>
                    <input type="date" id="trip-start-date" required class="w-full p-3.5 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-blue-500 outline-none font-semibold text-sm">
                </div>
                <div class="space-y-1.5">
                    <label class="text-sm font-bold text-slate-700">Số ngày dự kiến</label>
                    <input type="number" id="trip-days-count" min="1" max="30" value="2" required class="w-full p-3.5 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-blue-500 outline-none font-semibold text-sm">
                </div>
                <button onclick="submitTripForm()" class="w-full py-3.5 mt-2 font-bold text-white bg-blue-600 hover:bg-blue-700 rounded-xl shadow-lg shadow-blue-200/50 transition-colors flex justify-center items-center gap-2">
                    <i class="fa-solid fa-plus"></i> Tạo chuyến đi
                </button>
            </div>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="index.js"></script>

  
</body>
</html>
